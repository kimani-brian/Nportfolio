name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/portfolio
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            curl -fsS -H "Host: briankimani.duckdns.org" -o /dev/null -w "HTTP:%{http_code}\n" http://localhost/
            curl -fsS -o /dev/null -w "HTTPS:%{http_code}\n" https://briankimani.duckdns.org/

name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/portfolio
            git fetch origin main
            git reset --hard origin/main
            docker network create proxy || true
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            curl -fsS -H "Host: briankimani.duckdns.org" -o /dev/null -w "HTTP:%{http_code}\n" http://localhost/
            echo "Waiting for Caddy to obtain first cert (up to ~3 min)..."
            for i in $(seq 1 18); do
              if curl -fsS -o /dev/null https://briankimani.duckdns.org/; then
                curl -fsS -o /dev/null -w "HTTPS:%{http_code}\n" https://briankimani.duckdns.org/
                break
              fi
              echo "Attempt $i/18: cert not ready yet, retrying in 10s..."
              docker compose logs --tail=5 caddy || true
              sleep 10
              if [ "$i" = "18" ]; then
                echo "HTTPS never became ready. Caddy logs:"
                docker compose logs --tail=50 caddy
                exit 1
              fi
            done
            echo "Waiting for Crave & Glaze cert (up to ~3 min)..."
            for i in $(seq 1 18); do
              if curl -fsS -o /dev/null https://craveandglaze.duckdns.org/; then
                curl -fsS -o /dev/null -w "CRAVE-HTTPS:%{http_code}\n" https://craveandglaze.duckdns.org/
                break
              fi
              echo "Attempt $i/18: crave cert/upstream not ready yet, retrying in 10s..."
              sleep 10
              if [ "$i" = "18" ]; then
                echo "WARNING: craveandglaze.duckdns.org not ready (app may not be deployed yet). Caddy logs:"
                docker compose logs --tail=20 caddy || true
              fi
            done
